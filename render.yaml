services:
  - type: web
    name: amazebid-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://amazebid.co,https://www.amazebid.co
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VITE_ADMIN_EMAIL
        value: Nhatlinhckm2016@gmail.com
