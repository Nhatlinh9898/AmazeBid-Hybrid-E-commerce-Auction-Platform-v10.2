# =========================================================================
# Nginx Configuration for AmazeBid API Subdomain (api.amazebid.co)
# Place this file at: /etc/nginx/sites-available/api.amazebid.co
# Then enable it: ln -s /etc/nginx/sites-available/api.amazebid.co /etc/nginx/sites-enabled/
# =========================================================================

# Redirect HTTP to HTTPS once SSL cert is created by Certbot
server {
    listen 80;
    listen [::]:80;
    server_name api.amazebid.co;

    # Let's Encrypt / Certbot Webroot verification path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server block (Uncomment or let Certbot automatically inject this block)
# To manually configure SSL, replace placeholders with actual certificate paths
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.amazebid.co;

    # SSL Configuration (Certbot will manage these paths automatically)
    # ssl_certificate /etc/letsencrypt/live/api.amazebid.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.amazebid.co/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Backend API Proxy
    location / {
        proxy_pass http://localhost:3000; # Forward requests to local node.js app
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Buffer and Timeout Settings for stability
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 50M; # Support large image uploads
    }

    # Handle Socket.io path specifically
    location /socket.io/ {
        proxy_pass http://localhost:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Disable buffering and set high timeouts for persistent sockets
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
