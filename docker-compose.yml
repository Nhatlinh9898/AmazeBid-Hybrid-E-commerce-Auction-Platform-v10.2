version: '3.8'

services:
  amazebid-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amazebid-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    networks:
      - amazebid-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching/queues
  redis:
    image: redis:7-alpine
    container_name: amazebid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - amazebid-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # Optional: PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: amazebid-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: amazebid
      POSTGRES_PASSWORD: amazebid_password
      POSTGRES_DB: amazebid
    networks:
      - amazebid-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  amazebid-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
