    <!-- Polyfill for Node globals to avoid ReferenceError in browser environment -->
    <script>
      window.global = window;
      window.process = window.process || { env: { API_KEY: '' }, browser: true };
      if (!window.process.env) window.process.env = { API_KEY: '' };
    </script>
